<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LATAM Requests — Dashboard</title>
<style>
  :root {
    --c-primary: #2C5282; --c-primary-dark: #1A365D; --c-accent: #4A9FE0;
    --c-bg: #F4F6F9; --c-card: #FFFFFF; --c-border: #E2E8F0;
    --c-text: #1A202C; --c-muted: #718096; --c-danger: #C53030; --c-warn: #C05621; --c-success: #2F855A;
    --radius: 12px; --shadow: 0 1px 3px rgba(26,54,93,.08), 0 8px 24px rgba(26,54,93,.06);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif; background:var(--c-bg); color:var(--c-text); }

  /* header (Aceolution logo) */
  .app-header { background:var(--c-card); border:1px solid var(--c-border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .brand-wrap { display:flex; align-items:center; gap:14px; }
  .brand-logo { height:30px; width:auto; }
  .brand-divider { width:1px; height:30px; background:var(--c-border); }
  .brand-title-line { font-size:10px; color:var(--c-muted); letter-spacing:1.4px; font-weight:700; }
  .brand-region-line { color:var(--c-primary-dark); font-size:18px; font-weight:800; letter-spacing:1.5px; margin-top:1px; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .header-right .meta { font-size:12px; color:var(--c-muted); text-align:right; }
  .btn { background:var(--c-primary); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
  .btn:hover { background:var(--c-primary-dark); }
  .btn.ghost { background:#fff; color:var(--c-primary); border:1px solid var(--c-border); }
  .btn.ghost:hover { background:#F7FAFC; }
  .btn .pendnum { background:var(--c-danger); color:#fff; border-radius:999px; padding:1px 7px; font-size:11px; }

  .wrap { max-width:1320px; margin:22px auto 60px; padding:0 18px; }
  .readonly-note { font-size:12px; color:var(--c-muted); margin:-4px 0 16px; }

  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px; }
  .kpi { background:var(--c-card); border:1px solid var(--c-border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; }
  .kpi .label { font-size:12px; color:var(--c-muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .kpi .value { font-size:30px; font-weight:800; color:var(--c-primary-dark); line-height:1.1; margin-top:4px; }
  .kpi.alert .value { color:var(--c-danger); }
  .kpi.warn .value { color:var(--c-warn); }
  .kpi.ok .value { color:var(--c-success); }

  .panels { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:20px; }
  .card { background:var(--c-card); border:1px solid var(--c-border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
  .card h3 { margin:0 0 14px; font-size:14px; color:var(--c-primary-dark); text-transform:uppercase; letter-spacing:.4px; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px; }
  .bar-row .name { width:130px; flex-shrink:0; color:#2D3748; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track { flex:1; background:#EDF2F7; border-radius:6px; height:18px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:6px; background:var(--c-accent); min-width:2px; transition:width .3s; }
  .bar-row .count { width:34px; text-align:right; font-weight:700; color:var(--c-primary-dark); }

  .risk-card { margin-bottom:20px; }
  .risk-list { display:flex; flex-direction:column; gap:8px; }
  .risk-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:9px; border:1px solid var(--c-border); background:#fff; font-size:13px; }
  .risk-item.overdue { background:#FFF5F5; border-color:#FEB2B2; }
  .risk-item.soon { background:#FFFAF0; border-color:#FBD38D; }
  .risk-item .rid { font-weight:700; color:var(--c-primary); width:92px; flex-shrink:0; }
  .risk-item .rsub { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .risk-item .rdue { font-weight:700; }
  .risk-item.overdue .rdue { color:var(--c-danger); }
  .risk-item.soon .rdue { color:var(--c-warn); }
  .empty { color:var(--c-muted); font-size:13px; padding:8px 0; }

  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .filters select, .filters input { font:inherit; padding:8px 10px; border:1px solid var(--c-border); border-radius:8px; background:#fff; font-size:13px; }
  .filters input[type=search] { min-width:220px; }
  .filters .count-info { margin-left:auto; color:var(--c-muted); font-size:13px; }

  .table-card { padding:0; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { background:#F7FAFC; text-align:left; padding:11px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--c-muted); border-bottom:2px solid var(--c-border); position:sticky; top:0; white-space:nowrap; }
  tbody td { padding:10px 12px; border-bottom:1px solid #EDF2F7; vertical-align:middle; }
  tbody tr:hover { background:#F7FAFC; }
  tr.overdue { background:#FFF8F8; }
  tr.overdue:hover { background:#FFF0F0; }
  .rid-cell { font-weight:700; color:var(--c-primary); white-space:nowrap; }
  .subj-cell { max-width:280px; }
  .subj-cell .s-main { font-weight:600; }
  .subj-cell .s-sub { color:var(--c-muted); font-size:12px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
  .due-cell { white-space:nowrap; font-weight:600; }
  .due-cell.late { color:var(--c-danger); }
  .due-cell.soon { color:var(--c-warn); }

  .loading, .error-box { text-align:center; padding:50px; color:var(--c-muted); }
  .error-box { color:var(--c-danger); }
  .config-warn { background:#FFF5F5; border:1px solid #FEB2B2; color:#9B2C2C; padding:12px 14px; border-radius:9px; font-size:13px; margin-bottom:18px; }

  @media (max-width: 1000px) { .kpis { grid-template-columns:repeat(2,1fr); } .panels { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div class="brand-wrap">
        <img src="https://aceolution.com/img/logo2.png" alt="Aceolution" class="brand-logo" onerror="this.style.display='none'">
        <div class="brand-divider"></div>
        <div class="brand-sub">
          <div class="brand-title-line">ACEOLUTION · LATAM REQUESTS</div>
          <div class="brand-region-line">DASHBOARD</div>
        </div>
      </div>
      <div class="header-right">
        <div class="meta" id="meta-info"></div>
        <button class="btn ghost" id="refresh-btn">↻ Refresh</button>
      </div>
    </header>

    <div id="config-warn" class="config-warn" style="display:none">
      ⚠️ <b>Backend not configured.</b> Paste the Web App URL into <code>CONFIG.scriptUrl</code> at the top of this file.
    </div>

    <div id="content" style="display:none">
      <div class="kpis" id="kpis"></div>

      <div class="card risk-card">
        <h3>⚠️ Overdue / at risk</h3>
        <div class="risk-list" id="risk-list"></div>
      </div>

      <div class="panels">
        <div class="card"><h3>By status</h3><div id="by-status"></div></div>
        <div class="card"><h3>By category</h3><div id="by-category"></div></div>
        <div class="card"><h3>Workload by owner</h3><div id="by-responsible"></div></div>
      </div>

      <div class="filters">
        <select id="f-status"><option value="">All statuses</option></select>
        <select id="f-category"><option value="">All categories</option></select>
        <select id="f-responsible"><option value="">All owners</option></select>
        <select id="f-country"><option value="">All countries</option></select>
        <input id="f-search" type="search" placeholder="Search subject, project, requester…" />
        <label style="font-size:13px;color:var(--c-muted);display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="f-overdue" /> overdue only
        </label>
        <span class="count-info" id="count-info"></span>
      </div>

      <div class="card table-card">
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Subject</th><th>Category</th><th>Priority</th>
                <th>Owner</th><th>SLA / Due</th><th>ETA</th><th>Status</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="loading" id="loading">Loading requests…</div>
    <div class="error-box" id="error" style="display:none"></div>
  </div>

<script>
// =====================================================================
// CONFIG — same Web App URL as requests.html / triage.html
// =====================================================================
const CONFIG = {
  scriptUrl: 'https://script.google.com/macros/s/AKfycbza2es5niwMkvjzNbmbCfqLOLnxONG0iZPG4hsHtHmgSPioBk7XbMP5Xie-7F0ykCM9/exec',
  autoRefreshMs: 0, // e.g. 60000 to refresh every minute. 0 = off.
};

const STATUS_COLORS = {
  'New':             { bg:'#EBF8FF', fg:'#2B6CB0' },
  'Waiting on Me':   { bg:'#FEFCBF', fg:'#975A16' },
  'Waiting Internal':{ bg:'#E9D8FD', fg:'#6B46C1' },
  'Waiting Client':  { bg:'#E6FFFA', fg:'#2C7A7B' },
  'Waiting Vendor':  { bg:'#FEEBC8', fg:'#9C4221' },
  'Completed':       { bg:'#C6F6D5', fg:'#276749' },
  'Blocked':         { bg:'#FED7D7', fg:'#9B2C2C' },
  'Finished':        { bg:'#E2E8F0', fg:'#2D3748' },
};
const PRIORITY_COLORS = {
  'Urgent': { bg:'#FED7D7', fg:'#9B2C2C' }, 'High': { bg:'#FEEBC8', fg:'#9C4221' },
  'Normal': { bg:'#EBF8FF', fg:'#2B6CB0' }, 'Low': { bg:'#E2E8F0', fg:'#4A5568' },
};
const CLOSED = ['Completed', 'Finished'];
const SOON_DAYS = 2;

const DEFAULTS = {
  categories: ['Operations','Legal','Finance','Billing','HR','Recruiting','Client Requests','Fleet','Accidents','Ramp / Payhawk','Contracts','IT','Procurement','Business Development','New client'],
  statuses: ['New','Waiting on Me','Waiting Internal','Waiting Client','Waiting Vendor','Completed','Blocked','Finished'],
  priorities: ['Urgent','High','Normal','Low'],
  team: ['Bia','Fuss','Lucas Muzitano','David','Eduardo'],
  countries: ['Brazil','Argentina','Chile','Colombia','Mexico','Peru','LATAM (all)','Other'],
};

let META = Object.assign({}, DEFAULTS);
let ALL = [];       // validated only
let PENDING = 0;    // pending-triage count

const $ = function (id) { return document.getElementById(id); };
function isConfigured() { return CONFIG.scriptUrl && CONFIG.scriptUrl.indexOf('COLE_A_URL') !== 0; }

function parseDate(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d.getTime()) ? null : d; }
function fmtDate(iso) { const d = parseDate(iso); return d ? d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' }) : '—'; }
function daysUntil(iso) { const d = parseDate(iso); if (!d) return null; return Math.ceil((d.getTime() - Date.now()) / 86400000); }
function isOpen(r) { return CLOSED.indexOf(r.status) === -1; }
function isOverdue(r) { if (!isOpen(r) || !r.slaDue) return false; const d = parseDate(r.slaDue); return d && d.getTime() < Date.now(); }
function isSoon(r) { if (!isOpen(r) || isOverdue(r)) return false; const du = daysUntil(r.slaDue); return du !== null && du <= SOON_DAYS; }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function pill(text, colors) { const c = colors[text] || { bg:'#EDF2F7', fg:'#4A5568' }; return '<span class="pill" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(text || '—') + '</span>'; }

async function loadAll() {
  if (!isConfigured()) { $('config-warn').style.display = 'block'; $('loading').style.display = 'none'; return; }
  try {
    const [metaRes, reqRes] = await Promise.all([
      fetch(CONFIG.scriptUrl + '?action=getMeta').then(function (r) { return r.json(); }).catch(function () { return null; }),
      fetch(CONFIG.scriptUrl + '?action=getRequests').then(function (r) { return r.json(); }),
    ]);
    if (metaRes && metaRes.success) {
      META = {
        categories: metaRes.categories || DEFAULTS.categories,
        statuses: metaRes.statuses || DEFAULTS.statuses,
        priorities: metaRes.priorities || DEFAULTS.priorities,
        team: metaRes.team || DEFAULTS.team,
        countries: metaRes.countries || DEFAULTS.countries,
      };
    }
    if (!reqRes || !reqRes.success) throw new Error((reqRes && reqRes.error) || 'invalid response');
    const all = reqRes.requests || [];
    PENDING = all.filter(function (r) { return !r.validated; }).length;
    ALL = all.filter(function (r) { return r.validated; });

    setupFilters();
    render();
    $('loading').style.display = 'none';
    $('content').style.display = 'block';

    const now = new Date();
    $('meta-info').innerHTML = (metaRes && metaRes.version ? metaRes.version + ' · ' : '') +
      ALL.length + ' validated · ' + PENDING + ' pending · ' +
      now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  } catch (err) {
    $('loading').style.display = 'none';
    $('error').style.display = 'block';
    $('error').textContent = 'Error loading: ' + err.message;
  }
}

function setupFilters() {
  fillFilter('f-status', META.statuses);
  fillFilter('f-category', META.categories);
  fillFilter('f-responsible', META.team);
  fillFilter('f-country', META.countries);
}
function fillFilter(id, items) {
  const sel = $(id); const cur = sel.value; const first = sel.options[0];
  sel.innerHTML = ''; sel.appendChild(first);
  items.forEach(function (v) { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  sel.value = cur;
}

function render() { renderKpis(); renderRisk(); renderBars(); renderTable(); }

function renderKpis() {
  const total = ALL.length;
  const open = ALL.filter(isOpen).length;
  const overdue = ALL.filter(isOverdue).length;
  const blocked = ALL.filter(function (r) { return r.status === 'Blocked'; }).length;
  const done = ALL.filter(function (r) { return CLOSED.indexOf(r.status) >= 0; }).length;
  const cards = [
    { label:'Total', value:total, cls:'' },
    { label:'Open', value:open, cls:'' },
    { label:'Overdue', value:overdue, cls:'alert' },
    { label:'Blocked', value:blocked, cls:'warn' },
    { label:'Completed', value:done, cls:'ok' },
  ];
  $('kpis').innerHTML = cards.map(function (c) {
    return '<div class="kpi ' + c.cls + '"><div class="label">' + c.label + '</div><div class="value">' + c.value + '</div></div>';
  }).join('');
}

function renderRisk() {
  const risk = ALL.filter(function (r) { return isOverdue(r) || isSoon(r); })
    .sort(function (a, b) { return (parseDate(a.slaDue) || 0) - (parseDate(b.slaDue) || 0); });
  const el = $('risk-list');
  if (!risk.length) { el.innerHTML = '<div class="empty">Nothing overdue or near the deadline. 🎉</div>'; return; }
  el.innerHTML = risk.map(function (r) {
    const over = isOverdue(r); const du = daysUntil(r.slaDue);
    const dueTxt = over ? ('overdue by ' + Math.abs(du) + 'd') : ('due in ' + du + 'd');
    return '<div class="risk-item ' + (over ? 'overdue' : 'soon') + '">' +
      '<span class="rid">' + esc(r.id) + '</span>' +
      '<span class="rsub">' + esc(r.subject) + ' · ' + esc(r.category) + ' · ' + esc(r.responsible || 'no owner') + '</span>' +
      '<span class="rdue">' + dueTxt + ' (' + fmtDate(r.slaDue) + ')</span></div>';
  }).join('');
}

function countBy(key) { const m = {}; ALL.forEach(function (r) { const k = r[key] || '—'; m[k] = (m[k] || 0) + 1; }); return m; }
function barChart(containerId, counts, order, color) {
  const entries = order
    ? order.map(function (k) { return [k, counts[k] || 0]; }).filter(function (e) { return e[1] > 0; })
    : Object.keys(counts).map(function (k) { return [k, counts[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  const max = entries.reduce(function (m, e) { return Math.max(m, e[1]); }, 0) || 1;
  const el = $(containerId);
  if (!entries.length) { el.innerHTML = '<div class="empty">No data.</div>'; return; }
  el.innerHTML = entries.map(function (e) {
    const w = Math.round((e[1] / max) * 100);
    const col = (typeof color === 'function') ? color(e[0]) : color;
    return '<div class="bar-row"><span class="name" title="' + esc(e[0]) + '">' + esc(e[0]) + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + w + '%;background:' + col + '"></span></span>' +
      '<span class="count">' + e[1] + '</span></div>';
  }).join('');
}
function renderBars() {
  barChart('by-status', countBy('status'), META.statuses, function (k) { return (STATUS_COLORS[k] && STATUS_COLORS[k].fg) || '#4A9FE0'; });
  barChart('by-category', countBy('category'), null, '#4A9FE0');
  const openByResp = {};
  ALL.filter(isOpen).forEach(function (r) { const k = r.responsible || '— no owner'; openByResp[k] = (openByResp[k] || 0) + 1; });
  barChart('by-responsible', openByResp, null, '#2C5282');
}

function applyFilters() {
  const fs = $('f-status').value, fc = $('f-category').value, fr = $('f-responsible').value,
        fco = $('f-country').value, fq = $('f-search').value.trim().toLowerCase(), fo = $('f-overdue').checked;
  return ALL.filter(function (r) {
    if (fs && r.status !== fs) return false;
    if (fc && r.category !== fc) return false;
    if (fr && r.responsible !== fr) return false;
    if (fco && r.country !== fco) return false;
    if (fo && !isOverdue(r)) return false;
    if (fq) {
      const hay = (r.subject + ' ' + r.project + ' ' + r.requesterName + ' ' + r.description + ' ' + r.id).toLowerCase();
      if (hay.indexOf(fq) === -1) return false;
    }
    return true;
  });
}

function renderTable() {
  const rows = applyFilters();
  $('count-info').textContent = rows.length + ' of ' + ALL.length;
  const tb = $('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="8" class="empty" style="padding:24px;text-align:center">No requests match these filters.</td></tr>'; return; }
  tb.innerHTML = rows.map(function (r) {
    const over = isOverdue(r), soon = isSoon(r);
    const dueCls = over ? 'late' : (soon ? 'soon' : '');
    return '<tr class="' + (over ? 'overdue' : '') + '">' +
      '<td class="rid-cell">' + esc(r.id) + '</td>' +
      '<td class="subj-cell"><div class="s-main">' + esc(r.subject) + '</div>' +
        '<div class="s-sub">' + esc(r.requesterName) + (r.project ? ' · ' + esc(r.project) : '') + '</div></td>' +
      '<td>' + esc(r.category) + '</td>' +
      '<td>' + pill(r.priority, PRIORITY_COLORS) + '</td>' +
      '<td>' + esc(r.responsible || '—') + '</td>' +
      '<td class="due-cell ' + dueCls + '">' + fmtDate(r.slaDue) + '</td>' +
      '<td>' + fmtDate(r.eta) + '</td>' +
      '<td>' + pill(r.status, STATUS_COLORS) + '</td>' +
      '</tr>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function () {
  ['f-status','f-category','f-responsible','f-country'].forEach(function (id) { $(id).addEventListener('change', renderTable); });
  $('f-search').addEventListener('input', renderTable);
  $('f-overdue').addEventListener('change', renderTable);
  $('refresh-btn').addEventListener('click', function () {
    $('loading').style.display = 'block'; $('content').style.display = 'none'; $('error').style.display = 'none'; loadAll();
  });
  loadAll();
  if (CONFIG.autoRefreshMs > 0) setInterval(loadAll, CONFIG.autoRefreshMs);
});
</script>
</body>
</html>
